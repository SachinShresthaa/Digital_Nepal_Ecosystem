spring:
  datasource:
    url: jdbc:h2:mem:stubdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false
  batch:
    job:
      enabled: false

logging:
  level:
    root: INFO
